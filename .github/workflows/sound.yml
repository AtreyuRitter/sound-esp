
name: Build Gucci Sound ESP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Locate Minecraft project
        id: locate
        shell: bash
        run: |
          set -e

          SETTINGS=$(find . -type f \
            -name settings.gradle \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' | head -n 1)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          else
            BUILD=$(find . -type f \
              \( -name build.gradle -o -name build.gradle.kts \) \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*' | head -n 1)

            if [ -z "$BUILD" ]; then
              echo "No Gradle build file found!"
              find . -maxdepth 5 -type f
              exit 1
            fi

            PROJECT_DIR=$(dirname "$BUILD")
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project at: $PROJECT_DIR"

      - name: Verify project files
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          ls -la
          test -f build.gradle || test -f build.gradle.kts

      - name: Compile Minecraft mod
        run: gradle -p "${{ steps.locate.outputs.project_dir }}" clean build

      - name: Upload Gucci Sound ESP JAR
        uses: actions/upload-artifact@v4
        with:
          name: Gucci-Sound-ESP-1.21.11
          path: '**/build/libs/*.jar'
          if-no-files-found: error
