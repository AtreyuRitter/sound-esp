
name: Build Gucci Sound ESP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          BUILD_FILE=$(find . -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -not -path './.git/*' | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Could not find settings.gradle"
            find . -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Build Gucci Sound ESP
        run: gradle build
        working-directory: ${{ steps.project.outputs.project_dir }}

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: Gucci-Sound-ESP-1.21.11
          path: ${{ steps.project.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
